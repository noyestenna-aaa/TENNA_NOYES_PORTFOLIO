<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Writing samples by Tenna Noyes.">
  <meta name="theme-color" content="#070a08">
  <title>Writing Samples | Tenna Noyes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="index.html">Tenna Noyes<span>Portfolio</span></a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="education.html">Education</a>
      <a href="work-experience.html">Work Experience</a>
      <a aria-current="page" href="writing-samples.html">Writing Samples</a>
    </nav>
  </header>
  <main class="content" id="main">
    <p class="eyebrow">Selected work</p>
    <h1>Writing Samples</h1>
    <p class="intro">A collection of my writing and other selected work.</p>
    <section class="card" aria-labelledby="writing-details">
      <h2 id="writing-details">Writing samples</h2>
      <p>Selected writing samples and publication details will be added here.</p>
    </section>
  </main>
  <footer><p>© <span id="year"></span> Tenna Noyes</p></footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.addEventListener('DOMContentLoaded', () => {
      const body = document.body;
      body.classList.add('is-ready');

      const cursor = document.createElement('div');
      cursor.classList.add('cursor');
      document.body.appendChild(cursor);

      const moveCursor = (event) => {
        cursor.style.left = `${event.clientX}px`;
        cursor.style.top = `${event.clientY}px`;
      };

      document.addEventListener('pointermove', moveCursor);

      const clickableSelectors = [
        'a',
        'button',
        'input',
        'textarea',
        'select',
        '.button',
        '.card',
        '.brand',
        'nav a'
      ];

      clickableSelectors.forEach((selector) => {
        document.querySelectorAll(selector).forEach((element) => {
          element.addEventListener('mouseenter', () => cursor.classList.add('is-hovering'));
          element.addEventListener('mouseleave', () => cursor.classList.remove('is-hovering'));
        });
      });

      document.querySelectorAll('a[href]').forEach((link) => {
        const href = link.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) {
          return;
        }

        const isPageLink = href.endsWith('.html') || !href.includes('://');
        if (!isPageLink) {
          return;
        }

        link.addEventListener('click', (event) => {
          if (link.target === '_blank') return;

          event.preventDefault();
          body.classList.remove('is-ready');
          body.classList.add('page-transition');

          setTimeout(() => {
            window.location.href = href;
          }, 220);
        });
      });
    });
  </script>
</body>
</html>
